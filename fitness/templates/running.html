{% extends "base.html" %}

{% block title %}Running{% endblock %}

{% block content %}
<h1>Running</h1>

<div class="chart-grid chart-grid-large">
  <div>
    <h2>Metres per heartbeat (all runs)</h2>
    <div class="chart">
      <canvas id="metres-per-beat-chart" data-points='{{ metres_per_beat | tojson }}'></canvas>
    </div>
  </div>
  <div>
    <h2>Pace (base-HR runs)</h2>
    <div class="chart">
      <canvas id="pace-chart" data-points='{{ pace | tojson }}'></canvas>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='running.js') }}"></script>
{% endblock %}
