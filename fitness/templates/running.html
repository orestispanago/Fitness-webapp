{% extends "base.html" %}

{% block title %}Running{% endblock %}

{% block content %}
<h1>Running</h1>

<div class="chart-grid chart-grid-large">
  <div>
    <div class="chart">
      <canvas id="metres-per-beat-chart" data-title="Metres per heartbeat (all runs)"
        data-points='{{ metres_per_beat | tojson }}'></canvas>
    </div>
  </div>
  <div>
    <div class="chart">
      <canvas id="pace-chart" data-title="Pace (min/km, base-HR runs)" data-points='{{ pace | tojson }}'></canvas>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='running.js') }}"></script>
{% endblock %}
