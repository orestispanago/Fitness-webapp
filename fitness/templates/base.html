<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fitness{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='charts.js') }}"></script>
</head>

<body>
  <nav>
    <a href="{{ url_for('fitness_page') }}">Fitness</a>
    <a href="{{ url_for('running_page') }}">Running</a>
    <a href="{{ url_for('strength_page') }}">Strength</a>
    <form class="sync-form" method="post" action="{{ url_for('sync') }}">
      <input type="hidden" name="next" value="{{ request.path }}">
      <button type="submit">Sync</button>
    </form>
  </nav>
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <p class="flash flash-{{ category }}">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='sync.js') }}"></script>
</body>

</html>
