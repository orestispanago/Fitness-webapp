<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fitness{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
  <script src="{{ url_for('static', filename='charts.js') }}"></script>
</head>

<body>
  <nav>
    <a href="{{ url_for('fitness_page') }}">Fitness</a>
    <a href="{{ url_for('running_page') }}">Running</a>
    <a href="{{ url_for('strength_page') }}">Strength</a>
    <form class="sync-form" method="post" action="{{ url_for('sync') }}">
      <input type="hidden" name="next" value="{{ request.path }}">
      <button type="submit">↻ Sync</button>
    </form>
  </nav>
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='sync.js') }}"></script>
</body>

</html>
