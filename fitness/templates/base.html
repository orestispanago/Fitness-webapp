<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fitness{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
  <script src="{{ url_for('static', filename='charts.js') }}"></script>
</head>

<body>
  <nav>
    {% for endpoint, label in [("fitness_page", "Fitness"), ("running_page", "Running"), ("strength_page", "Strength")] %}
    <a href="{{ url_for(endpoint) }}" {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
    <form class="sync-form" method="post" action="{{ url_for('sync') }}">
      <input type="hidden" name="next" value="{{ request.path }}">
      <button type="submit">Sync</button>
    </form>
  </nav>
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='sync.js') }}"></script>
</body>

</html>
