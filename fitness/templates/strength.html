{% extends "base.html" %}

{% block title %}Strength{% endblock %}

{% block content %}
<h1>Strength</h1>

{% for group in groups %}
{% set group_index = loop.index0 %}
<h2>{{ group.label }}</h2>
<div class="chart-grid">
  {% for exercise in group.exercises %}
  <div>
    <div class="chart chart-small">
      <canvas class="exercise-chart" data-title="{{ exercise.label }}" data-group='{{ group_index }}'
        data-points='{{ exercise.points | tojson }}'></canvas>
    </div>
  </div>
  {% endfor %}
</div>
{% endfor %}

<script src="{{ url_for('static', filename='strength.js') }}"></script>
{% endblock %}
