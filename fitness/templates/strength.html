{% extends "base.html" %}

{% block title %}Strength{% endblock %}

{% block content %}
<h1>Strength</h1>

<div class="tabs">
  {% for label in labels %}
  {% if label == selected %}
  <a class="tab active" href="{{ url_for('strength_page', group=label) }}" aria-current="page">{{ label }}</a>
  {% else %}
  <a class="tab" href="{{ url_for('strength_page', group=label) }}">{{ label }}</a>
  {% endif %}
  {% endfor %}
</div>

<div class="chart-grid">
  {% for exercise in exercises %}
  <div>
    <div class="chart chart-small exercise-chart" data-title="{{ exercise.label }}"
      data-points='{{ exercise.points | tojson }}'></div>
  </div>
  {% endfor %}
</div>

<script src="{{ url_for('static', filename='strength.js') }}"></script>
{% endblock %}
